version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: disaster_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disaster_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disaster_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-disaster_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disaster_admin} -d ${POSTGRES_DB:-disaster_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - disaster_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-disaster_admin}:${POSTGRES_PASSWORD:-disaster_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-disaster_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEFAULT_LAT=22.2604
      - DEFAULT_LON=84.8536
      - DEFAULT_DISTRICT=Rourkela
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: disaster_frontend
    restart: always
    networks:
      - disaster_net

  nginx:
    image: nginx:1.27-alpine
    container_name: disaster_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - disaster_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: disaster_cloudflared
    restart: always
    command: tunnel --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - disaster_net

volumes:
  postgres_data:
    driver: local

networks:
  disaster_net:
    driver: bridge
