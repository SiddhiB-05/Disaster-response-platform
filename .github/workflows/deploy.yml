name: CI/CD Pipeline - Test & Deploy to AWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: 🧪 Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies & Run Pytest
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx
          PYTHONPATH=. pytest app/tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Run Build Check
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'smit45-m/Disaster-response-platform'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Deploy to EC2 via AWS Systems Manager (SSM)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=disaster-response-platform" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "⚠️ No running EC2 instance found with tag Project=disaster-response-platform. Skipping remote deployment."
            exit 0
          fi

          echo "🚀 Found EC2 Instance: $INSTANCE_ID. Triggering automated deployment..."

          COMMANDS='[
            "cd /opt/disaster-response-platform",
            "git pull origin main",
            "docker compose -f docker-compose.prod.yml up -d --build --remove-orphans",
            "docker system prune -f",
            "sleep 10",
            "curl -f http://localhost/healthz || exit 1"
          ]'

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent: $COMMAND_ID. Waiting for completion..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "🎉 Deployment to AWS EC2 completed successfully!"
